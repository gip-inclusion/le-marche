version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore(deps): "
      prefix-development: "chore(dev-deps): "
    # Allow up to 20 concurrent open PRs
    open-pull-requests-limit: 20
    allow:
      # Allow both direct and indirect updates for all packages
      - dependency-type: all
    groups:
      psycopg:
        patterns:
          - "psycopg*"
