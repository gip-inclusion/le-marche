name: bbtest review app boundary

on:
  pull_request:
    types: [labeled, synchronize]

env:
  CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
  CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
  CLEVER_ORG_ID: ${{ secrets.CLEVER_REVIEW_APPS_ORG }}

jobs:
  bbtest-safe-presence:
    runs-on: ubuntu-latest
    permissions: {}
    if: github.event.action == 'labeled' && github.event.label.name == 'recette-jetable'
    steps:
      - name: bbtest safe identity and presence only
        shell: bash
        run: |
          id
          env | cut -d = -f 1
          if [[ -n "${CLEVER_TOKEN:-}" ]]; then
            echo CLEVER_TOKEN_PRESENT
          else
            echo CLEVER_TOKEN_EMPTY_OR_UNSET
          fi
          if [[ -n "${CLEVER_SECRET:-}" ]]; then
            echo CLEVER_SECRET_PRESENT
          else
            echo CLEVER_SECRET_EMPTY_OR_UNSET
          fi
          if [[ -n "${CLEVER_ORG_ID:-}" ]]; then
            echo CLEVER_ORG_ID_PRESENT
          else
            echo CLEVER_ORG_ID_EMPTY_OR_UNSET
          fi
          exit 0
