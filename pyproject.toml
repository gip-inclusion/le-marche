[project]
name = "lemarche"
version = "1.0"
description = "Marché de l'inclusion"
authors = []
requires-python = ">=3.13,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "boto3",
    "brevo-python",
    "crawlerdetect",
    "django>=5.2,<6",
    "django-admin-list-filters",
    "django-allauth",
    "django-anymail",
    "django-better-admin-arrayfield",
    "django-ckeditor",
    "django-compressor",
    "django-cors-headers",
    "django-datadog-logger",
    "django-dsfr<2.0.0",
    "django-environ",
    "django-extensions",
    "django-filter",
    "django-formtools",
    "django-htmx",
    "django-libsass",
    "django-phonenumber-field[phonenumbers]",
    "djangorestframework",
    "django-sesame",
    "django-simple-history",
    "django-storages",
    "drf-spectacular",
    "huey",
    "nh3",
    "psycopg[binary]",
    "python-stdnum",
    "redis",
    "requests",
    "sentry-sdk",
    "shortuuid",
    "openpyxl",
    "xlwt",
    "wagtail",
    "wagtail-localize",
    "wagtail-markdown",
    "wagtail-modeladmin",
    "wagtailmenus",
    "unidecode",
]

[dependency-groups]
dev = [
    "coverage",
    "django-debug-toolbar",
    "factory-boy",
    "freezegun",
    "ipdb",
    "itoutils[django-testing]",
    "pre-commit",
    "pytest",
    "pytest-django",
    "pytest-randomly",
    "pytest-xdist",
    "ruff",
    "selenium",
]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
# see prefixes in https://beta.ruff.rs/docs/rules/
select = [
    "F",  # pyflakes
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "I",  # isort
    "UP",  # pyupgrade
    "TID",  # flake8-tidy-imports
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["itou"]
lines-after-imports = 2

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest]
DJANGO_SETTINGS_MODULE = "lemarche.settings.test"
python_files = ["tests*.py", "test_*.py"]
filterwarnings = [
    "error",
    "ignore:.*Use timezone-aware objects to represent datetimes in UTC.*:DeprecationWarning:(botocore|django_datadog_logger)",
    "ignore:.*The dsfr_form tag is deprecated.*:DeprecationWarning",
    "ignore:unclosed file.*:ResourceWarning",
]
addopts = [
    "--reuse-db",
    "--strict-markers",
]
